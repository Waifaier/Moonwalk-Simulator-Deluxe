<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Moonwalk Arena</title>

<link rel="stylesheet"
href="multiplayer.css">

</head>

<body>

<div class="container">

<h1>
🌎 Moonwalk Arena
</h1>

<input
id="playerName"
placeholder="Seu nome">

<br>

<button id="createBtn">
🎮 Criar Sala
</button>

<br><br>

<input
id="roomCode"
placeholder="Código da Sala">

<br>

<button id="joinBtn">
🚪 Entrar na Sala
</button>

<h2 id="status">
Nenhuma sala
</h2>

<div class="battle">

<div class="card">

<h2 id="meName">
Você
</h2>

<p>
💰 <span id="meMoney">0</span>
</p>

<p>
💎 <span id="meDiamonds">0</span>
</p>

<p>
⚡ <span id="meClick">1</span>
</p>

<p>
🏭 <span id="meAuto">0</span>
</p>

</div>

<div class="vs">
VS
</div>

<div class="card">

<h2 id="enemyName">
???
</h2>

<p>
💰 <span id="enemyMoney">0</span>
</p>

<p>
💎 <span id="enemyDiamonds">0</span>
</p>

<p>
⚡ <span id="enemyClick">1</span>
</p>

<p>
🏭 <span id="enemyAuto">0</span>
</p>

</div>

</div>

<h1 id="timer">
05:00
</h1>

</div>

<script type="module"
src="multiplayer.js"></script>

</body>

</html>
