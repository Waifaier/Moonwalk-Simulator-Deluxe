<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Moonwalk Simulator Deluxe V2
</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<div class="container">

    <h1>
        🌙 Moonwalk Simulator Deluxe
    </h1>

    <div class="stats">

        <div>
            💰 R$
            <span id="money">0</span>
        </div>

        <div>
            💎
            <span id="diamonds">0</span>
        </div>

        <div>
            ⚡ Clique:
            <span id="clickPower">1</span>
        </div>

        <div>
            🏭 Auto:
            <span id="autoPower">0</span>/s
        </div>

    </div>

    <div
    id="stageName"
    class="stageName">

    Michael Mendigo

    </div>

    <div
    id="gameArea">

        <div
        id="dancers">

        </div>

        <div
        id="michael"
        class="michael">

        🧍

        </div>

    </div>

    <button
    id="shopBtn">

    🛒 SHOP

    </button>

    <div
    id="shop">

        <div class="shopSection">

            <h3>
                👞 Equipamentos
            </h3>

            <div
            id="equipmentShop">

            </div>

        </div>

        <div class="shopSection">

            <h3>
                🕴️ Equipe
            </h3>

            <div
            id="teamShop">

            </div>

        </div>

        <div class="shopSection">

            <h3>
                🚘 Veículos
            </h3>

            <div
            id="vehicleShop">

            </div>

        </div>

        <div class="shopSection">

            <h3>
                🏢 Negócios
            </h3>

            <div
            id="businessShop">

            </div>

        </div>

        <div class="shopSection">

            <h3>
                💎 Loja de Diamantes
            </h3>

            <div
            id="diamondShop">

            </div>

        </div>

    </div>

    <h2>
        🏆 Conquistas
    </h2>

    <div
    id="achievements">

    </div>

</div>

<footer id="credits">
    Jogo feito por Wifier
</footer>

<script src="script.js"></script>

</body>
</html>
