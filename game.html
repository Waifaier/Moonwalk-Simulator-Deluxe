<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Moonwalk Simulator Deluxe V2
</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<div class="container">

    <h1>
        🌙 Moonwalk Simulator Deluxe
    </h1>

    
<div id="matchTimer" style="font-size:28px;text-align:center;margin:10px">⏳ Tempo Restante: 05:00</div>
<div style="display:flex;justify-content:space-around;margin:10px;border:1px solid #555;padding:10px">
<div>
<h3>👤 Você</h3>
<div>🃏 Coringas: <span id="jokerCount">0</span></div>
</div>
<div>
<h3>⚔️ Adversário</h3>
<div>💰 <span id="enemyMoney">0</span></div>
<div>💎 <span id="enemyDiamonds">0</span></div>
</div>
</div>
<div class="stats">

        <div>
            💰 R$
            <span id="money">0</span>
        </div>

        <div>
            💎
            <span id="diamonds">0</span>
        </div>

        <div>
            ⚡ Clique:
            <span id="clickPower">1</span>
        </div>

        <div>
            🏭 Auto:
            <span id="autoPower">0</span>/s
        </div>

    </div>

    <div
    id="stageName"
    class="stageName">

    Michael Mendigo

    </div>

    <div
    id="gameArea">

        <div
        id="dancers">

        </div>

        <div
        id="michael"
        class="michael">

        🧍

        </div>

    </div>

    <button
    id="shopBtn">

    🛒 SHOP

    </button>

    <div
    id="shop">

        <div class="shopSection">

            <h3>
                👞 Equipamentos
            </h3>

            <div
            id="equipmentShop">

            </div>

        </div>

        <div class="shopSection">

            <h3>
                🕴️ Equipe
            </h3>

            <div
            id="teamShop">

            </div>

        </div>

        <div class="shopSection">

            <h3>
                🚘 Veículos
            </h3>

            <div
            id="vehicleShop">

            </div>

        </div>

        <div class="shopSection">

            <h3>
                🏢 Negócios
            </h3>

            <div
            id="businessShop">

            </div>

        </div>

        <div class="shopSection">

            <h3>
                💎 Loja de Diamantes
            </h3>

            <div
            id="diamondShop">

            </div>

        </div>

    </div>

    <h2>
        🏆 Conquistas
    </h2>

    <div
    id="achievements">

    </div>

</div>

<footer id="credits">
    Jogo feito por Wifier
</footer>

<button id="menuBtn" class="menu-btn">
☰ Menu
</button>

<script src="script.js"></script>

</body>
</html>
